<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QNS Web Sites</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="hero">
      <div class="logo" aria-hidden="true"><span>Q</span></div>
      <div><span class="eyebrow">QUILIBRIUM · QNS</span><h1>Q Web Sites</h1><p>Open supported public .q sites.</p></div>
    </header>
    <section class="panel">
      <h2>Open a .q site</h2>
      <form id="open-form">
        <label for="open-name">Available .q site</label>
        <div class="row"><input id="open-name" list="shared-sites" placeholder="obscura.q" autocomplete="off" spellcheck="false" required><button class="primary" type="submit">Open</button></div>
        <datalist id="shared-sites"></datalist>
      </form>
    </section>
    <p id="status" class="status" role="status"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
